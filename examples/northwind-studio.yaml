# Northwind Studio: a small product studio that takes an idea to a release.
#
# Four departments, nine people, each department with someone in charge and its
# own idea of what "reviewed" means — which is the point. A studio does not
# review a deploy the way it reviews a wireframe.
#
# Work moves along the handoff connections: Product decides what to build,
# Design draws it, Engineering builds it, Operations ships it. Escalation runs
# back up the same spine, so a task nobody can finish reaches a person.
version: 1
office:
  id: office-northwind
  name: Northwind Studio
  schedule: { kind: always }

# What this office can reach outside itself. Each connector names the hosts it
# may read, so granting one is granting exactly that much of the internet —
# Design can look at Figma's help, Operations can read the status page, and
# neither can read the other's.
connectors:
  - id: conn-web-design
    kind: web
    name: design-web
    tools: [fetch_url]
    config:
      hosts:
        - help.figma.com
        - "*.w3.org"
  - id: conn-web-ops
    kind: web
    name: ops-web
    tools: [fetch_url]
    config:
      hosts:
        - www.githubstatus.com

departments:
  # A brief is not work until the head of product agrees it is the right work.
  - id: dept-product
    name: Product
    color: "#8b5cf6"
    position: { x: 0, y: 0 }
    size: { width: 420, height: 260 }
    reviewPolicy: { kind: manager, maxIterations: 2 }
    definitionOfDone:
      - the problem is stated in one sentence
      - success is measurable

  - id: dept-design
    name: Design
    color: "#ec4899"
    position: { x: 460, y: 0 }
    size: { width: 420, height: 260 }
    reviewPolicy: { kind: manager, maxIterations: 2 }
    definitionOfDone:
      - every state is drawn, including the empty one
      - it works at phone width
    # Granted to the room: hiring another designer does not mean granting again.
    tools:
      - { connector: conn-web-design, tool: fetch_url }

  # Engineers review each other. The manager runs the department, not the diff.
  - id: dept-engineering
    name: Engineering
    color: "#3b82f6"
    position: { x: 0, y: 300 }
    size: { width: 520, height: 320 }
    reviewPolicy: { kind: peer, maxIterations: 3 }
    definitionOfDone:
      - the tests cover the error path
      - nothing was left commented out

  # Nothing leaves this building on an agent's word: a person approves a deploy
  # and a person approves money.
  - id: dept-operations
    name: Operations
    color: "#f59e0b"
    position: { x: 560, y: 300 }
    size: { width: 380, height: 220 }
    reviewPolicy: { kind: gate, gatedActions: [deploy, spend] }
    definitionOfDone:
      - the rollback was rehearsed
      - the release notes are written
    tools:
      - { connector: conn-web-ops, tool: fetch_url }

employees:
  - id: emp-vera
    department: dept-product
    name: Vera
    skills: [strategy, pricing]
    role: Head of product
    color: "#8b5cf6"
    llm: { provider: anthropic, model: claude-opus-5 }

  - id: emp-ravi
    department: dept-product
    name: Ravi
    skills: [research, analysis]
    role: Product analyst
    color: "#8b5cf6"
    supervisor: emp-vera
    llm: { provider: anthropic, model: claude-sonnet-5 }

  - id: emp-iris
    department: dept-design
    name: Iris
    skills: [art-direction, brand]
    role: Design lead
    color: "#ec4899"
    llm: { provider: anthropic, model: claude-opus-5 }

  - id: emp-theo
    department: dept-design
    name: Theo
    skills: [visual-design, prototyping]
    role: Product designer
    color: "#ec4899"
    supervisor: emp-iris
    llm: { provider: anthropic, model: claude-sonnet-5 }

  - id: emp-grace
    department: dept-engineering
    name: Grace
    skills: [architecture]
    role: Engineering manager
    color: "#3b82f6"
    llm: { provider: anthropic, model: claude-opus-5 }

  - id: emp-ada
    department: dept-engineering
    name: Ada
    skills: [backend, sql]
    role: Backend engineer
    color: "#3b82f6"
    supervisor: emp-grace
    llm: { provider: anthropic, model: claude-sonnet-5 }

  - id: emp-linus
    department: dept-engineering
    name: Linus
    skills: [frontend]
    role: Frontend engineer
    color: "#3b82f6"
    supervisor: emp-grace
    llm: { provider: anthropic, model: claude-sonnet-5 }

  # Cheap and fast: a test run does not need the biggest model in the building.
  - id: emp-kai
    department: dept-engineering
    name: Kai
    skills: [testing]
    role: QA engineer
    color: "#3b82f6"
    supervisor: emp-grace
    llm: { provider: anthropic, model: claude-haiku-4-5-20251001 }

  - id: emp-nadia
    department: dept-operations
    name: Nadia
    skills: [release, infrastructure]
    role: Operations manager
    color: "#f59e0b"
    llm: { provider: anthropic, model: claude-sonnet-5 }

connections:
  # Work handed on needs somebody to land on. A skill names what the next
  # department has to be good at; the freest match takes it. Naming a person
  # instead is for a path where only one desk will do.
  - id: conn-product-design
    from: dept-product
    to: dept-design
    kind: handoff
    rules: { assign: { skill: visual-design } }
  - id: conn-design-eng
    from: dept-design
    to: dept-engineering
    kind: handoff
    rules: { assign: { skill: backend } }
  # Operations is one person, so there is nothing to choose between.
  - { id: conn-eng-ops, from: dept-engineering, to: dept-operations, kind: handoff }
  - { id: conn-design-product, from: dept-design, to: dept-product, kind: escalates_to }
  - { id: conn-eng-product, from: dept-engineering, to: dept-product, kind: escalates_to }
  - { id: conn-ops-eng, from: dept-operations, to: dept-engineering, kind: escalates_to }

  # Nothing ships without Operations looking at it. Engineering reviews its own
  # work first; this is a second pair of eyes from outside the department, which
  # is why it lives on the arrow rather than in Engineering's own policy.
  - { id: conn-ops-checks-eng, from: dept-operations, to: dept-engineering, kind: reviews }

  # Operations watches the rest of the studio. Nobody else knows it is there and
  # nobody waits for it: when work anywhere stalls or gets sent upward,
  # Operations raises its own task to find out why. This is the office's error
  # log, drawn as arrows rather than hidden in a subsystem.
  - id: conn-ops-watch-product
    from: dept-operations
    to: dept-product
    kind: watches
    rules: { for: [work_went_wrong] }
  - id: conn-ops-watch-design
    from: dept-operations
    to: dept-design
    kind: watches
    rules: { for: [work_went_wrong] }
  - id: conn-ops-watch-eng
    from: dept-operations
    to: dept-engineering
    kind: watches
    rules: { for: [work_went_wrong] }
